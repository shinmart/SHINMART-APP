<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ШИНМАРТ · Остатки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15181d; --ink2:#5b636f; --ink3:#98a0ab; --line:#e7e9ed; --bg:#f4f5f7; --card:#fff; --fill:#eceef2;
  --accent:#ff9a00; --accent-d:#d98100; --accent-ink:#1a1000;
  --red:#d93025; --amber:#b86e00; --green:#17803d;
  --nav:0px; --col:560px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 "Golos Text",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.hidden{display:none!important}
body.hide .secret{display:none!important}
svg{display:block}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.app{max-width:var(--col);margin:0 auto;min-height:100vh;background:var(--card);position:relative}
@media (min-width:600px){ .app{box-shadow:0 0 0 1px var(--line)} }

/* верх */
.top{position:sticky;top:0;z-index:30;background:var(--card);display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 8px) 8px 4px 16px}
.brand{flex:1;font-weight:700;font-size:16px;letter-spacing:.2px}
.brand span{display:block;font-weight:400;font-size:11.5px;color:var(--ink3);margin-top:1px;letter-spacing:0}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink2)}
.ib:active{background:var(--fill)}
.ib.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 28px)}
.tab{display:none}.tab.on{display:block}
.pad{padding:0 16px}

/* поиск */
.sbar{position:sticky;top:var(--topH,56px);z-index:20;background:var(--card);padding:6px 16px 0;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:14px;padding:0 6px 0 14px;height:52px}
.search svg{color:var(--ink3);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;height:100%;font-size:17px;font-weight:500}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input::placeholder{color:var(--ink3);font-weight:400}
.search .x{width:40px;height:40px;border-radius:50%;font-size:22px;color:var(--ink2)}
.ttabs{display:flex;align-items:center;gap:20px;height:44px;overflow-x:auto;scrollbar-width:none}
.ttabs::-webkit-scrollbar{display:none}
.ttabs button{flex:none;height:44px;font-weight:500;color:var(--ink3);position:relative}
.ttabs button.on{color:var(--ink);font-weight:600}
.ttabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ink);border-radius:2px}
.ttabs .sp{flex:1}
.ttabs .tg{font-size:13px;padding:0 10px;border-radius:8px;height:30px;background:var(--fill);color:var(--ink2)}
.ttabs .tg.on{background:var(--ink);color:#fff}
.ttabs .tg.on::after{display:none}
.fbar{display:flex;align-items:center;gap:10px;padding:8px 0 10px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.fbar b{color:var(--ink);font-weight:600}
.fbar .clr{margin-left:auto;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.mini{display:inline-flex;gap:2px;background:var(--fill);border-radius:9px;padding:2px}
.mini button{height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.mini button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* список */
.grp{position:sticky;top:var(--grpTop,150px);z-index:5;background:var(--bg);padding:6px 16px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;justify-content:space-between}
.gap{height:16px;background:var(--bg);border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);min-height:64px;cursor:pointer}
.row:active{background:var(--bg)}
.row .l{flex:1;min-width:0}
.row .sz{font-size:17px;font-weight:600;display:flex;align-items:baseline;gap:8px}
.row .sz i{font-style:normal;font-size:11.5px;font-weight:500;color:var(--ink3)}
.row .nm{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .nt{font-size:12px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.row .nt span{color:var(--ink3)}
.row .nt .w{color:var(--amber);font-weight:500}
.row .nt .r{color:var(--red);font-weight:500}
.row .r{text-align:right;flex:none}
.row .pr{font-size:16px;font-weight:600}
.row .st{font-size:12.5px;color:var(--ink2);margin-top:2px}
.row .st.low{color:var(--amber);font-weight:600}
.row .st.zero{color:var(--red);font-weight:600}
.empty{text-align:center;color:var(--ink3);padding:48px 24px}
.more{display:block;width:calc(100% - 32px);margin:12px 16px;height:46px;border-radius:12px;background:var(--fill);font-weight:600}
.banner{margin:8px 16px;padding:10px 12px;border-radius:12px;background:#fff4d6;color:#6b4e00;font-size:13px}
.banner a{font-weight:600;text-decoration:underline;color:inherit}

/* общие элементы форм */
.sec{padding:16px}
.sec+.sec{border-top:8px solid var(--bg)}
.lbl{font-size:12.5px;color:var(--ink2);margin-bottom:6px;font-weight:500}
.inp{width:100%;height:50px;border-radius:12px;border:0;background:var(--fill);padding:0 14px;font-size:17px;font-weight:600;outline:0}
.inp:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.inp.big{height:58px;font-size:24px;font-weight:700}
.inp::placeholder{color:var(--ink3);font-weight:400}
.f{margin-bottom:14px;min-width:0}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:40px;border-radius:9px;font-weight:500;color:var(--ink2);font-size:14.5px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.step{display:flex;align-items:center;background:var(--fill);border-radius:14px;height:58px}
.step button{width:58px;height:58px;font-size:26px;font-weight:500;color:var(--ink)}
.step button:active{background:rgba(0,0,0,.06);border-radius:14px}
.step input{flex:1;min-width:0;text-align:center;border:0;outline:0;background:none;font-size:26px;font-weight:700}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pills button{height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-weight:500;font-size:14px;color:var(--ink2)}
.pills button.on{background:var(--ink);color:#fff;font-weight:600}
.pills b{font-weight:600}
.go{display:block;width:100%;height:58px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;box-shadow:0 2px 0 var(--accent-d)}
.go:active{transform:translateY(2px);box-shadow:none}
.go:disabled{background:var(--fill);color:var(--ink3);box-shadow:none}
.go.warn{background:#ffe0a3;box-shadow:0 2px 0 #e0b25a}
.go.bad{background:var(--red);color:#fff;box-shadow:0 2px 0 #9f2018}
.go.busy{opacity:.65}
.sub{display:flex;gap:6px;margin-top:10px}
.sub button{flex:1;height:44px;border-radius:12px;font-weight:500;color:var(--ink2);font-size:14px}
.sub button:active{background:var(--fill)}
.note{font-size:13px;color:var(--ink2);margin:10px 0 0}
.note.w{color:var(--amber)} .note.b{color:var(--red);font-weight:500}
.calc{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--ink2);margin:12px 0 14px;flex-wrap:wrap}
.calc b{color:var(--ink);font-weight:600}
.calc .gd{color:var(--green)} .calc .bd{color:var(--red)}
details.more2{margin-bottom:14px}
details.more2 summary{list-style:none;cursor:pointer;font-size:14px;font-weight:500;color:var(--ink2);padding:6px 0}
details.more2 summary::-webkit-details-marker{display:none}
details.more2 summary::after{content:" ▾"}
details.more2[open] summary::after{content:" ▴"}

/* подсказки и выбранная позиция */
.sug{margin-top:6px;border-radius:12px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.sug:empty{display:none}
.sug button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.sug button:last-child{border-bottom:0}
.sug button:active{background:var(--bg)}
.sug button>div{min-width:0;flex:1}
.sug span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug b{font-weight:600} .sug span{display:block;font-size:12.5px;color:var(--ink2)} .sug em{font-style:normal;color:var(--ink2);font-size:13px;white-space:nowrap}
.chosen{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:12px;padding:10px 6px 10px 14px}
.chosen .t{flex:1;min-width:0}.chosen b{font-weight:700;font-size:16px;display:block}.chosen span{display:block;font-size:13px;color:var(--ink2)}
.chosen .x{width:40px;height:40px;border-radius:50%;font-size:22px;color:var(--ink2)}

/* операции */
.op{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.op .l{flex:1;min-width:0}.op b{font-weight:600;font-size:15px;display:block}
.op .n{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .m{font-size:12px;color:var(--ink3);margin-top:2px}
.op .r{text-align:right;font-weight:600;flex:none}
.op .r small{display:block;font-size:12px;font-weight:500;color:var(--green)}
.op .r small.neg{color:var(--red)}
.undo{margin-top:6px;font-size:12.5px;font-weight:500;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.btns{display:flex;gap:18px;margin-top:6px;flex-wrap:wrap}
.btns .undo{margin-top:0}
.tagx{display:inline-block;font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--fill);border-radius:6px;padding:1px 7px;margin-left:8px;vertical-align:1px}
.tagx.w{background:#ffe9c2;color:var(--amber)} .tagx.r{background:#e3f1ff;color:#1a5fa8}
.invbar{position:sticky;bottom:calc(var(--nav) + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);padding:10px 16px;z-index:15}
.inrow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.inrow .l{flex:1;min-width:0}.inrow b{font-size:16px;font-weight:600}.inrow span{display:block;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inrow input{width:84px;height:48px;border:0;border-radius:12px;background:var(--fill);text-align:center;font-size:20px;font-weight:700;outline:0}
.inrow input::placeholder{color:var(--ink3);font-weight:500}
.inrow input:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.inrow .df{width:44px;text-align:center;font-weight:700;font-size:14px}
.inrow .df.p{color:var(--green)} .inrow .df.m{color:var(--red)}
.undo.sure{color:var(--red);font-weight:600}
.sum3{display:flex;gap:20px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sum3 div{font-size:12.5px;color:var(--ink2)}.sum3 b{display:block;font-size:20px;font-weight:700;color:var(--ink)}
.sum3 .m b{color:var(--green)}
.dayrow{display:flex;gap:10px;align-items:center;padding:8px 16px 4px}
.dayrow input[type=date]{height:40px;border-radius:10px;border:0;background:var(--fill);padding:0 10px;font-weight:500;font-size:14px}

/* ещё */
.lnk{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 16px;border-bottom:1px solid var(--line);text-align:left;font-weight:500}
.lnk:active{background:var(--bg)}
.lnk small{display:block;font-weight:400;color:var(--ink2);font-size:12.5px;margin-top:1px}
.lnk em{font-style:normal;font-weight:700;color:var(--ink);margin-left:12px}
.lnk .chev{color:var(--ink3);margin-left:8px}
.h2{padding:18px 16px 6px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.back{display:flex;align-items:center;gap:6px;padding:10px 12px;font-weight:600;color:var(--ink2)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kpi{background:var(--card);padding:14px 16px}.kpi small{display:block;font-size:12.5px;color:var(--ink2)}.kpi b{display:block;font-size:21px;font-weight:700;margin-top:2px}
.kpi.m b{color:var(--green)}
.chips{display:flex;gap:8px;padding:6px 16px 10px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-weight:500;font-size:14px;color:var(--ink2)}
.chips button.on{background:var(--ink);color:#fff;font-weight:600}
.bar{padding:10px 16px;border-bottom:1px solid var(--line)}
.bar .t{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.bar .t span:last-child{font-weight:600}
.bar small{color:var(--green);font-size:12px;margin-left:6px;font-weight:500}
.bar i{display:block;height:4px;border-radius:2px;background:var(--ink);margin-top:7px;opacity:.85}
.cls{border-bottom:1px solid var(--line)}
.cls-h{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left}
.cls-l{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--fill);flex:none}
.cls-l.A{background:#dff3e6;color:var(--green)}.cls-l.B{background:#fff0c9;color:var(--amber)}.cls-l.C{background:#ffe4d6;color:#a2461a}.cls-l.D{background:#fbdcd9;color:var(--red)}
.cls-h .t{flex:1;min-width:0}.cls-h b{display:block;font-weight:600}.cls-h small{display:block;font-size:12.5px;color:var(--ink2)}
.cls-h .r{font-weight:600}
.cls-b{background:var(--bg)}
.cls-b .op{cursor:pointer;background:var(--card)}

/* нижнее меню */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,var(--col));z-index:40;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--ink3);position:relative}
.nav button.on{color:var(--ink);font-weight:600}
.nav button.on::before{content:"";position:absolute;top:6px;width:4px;height:4px;border-radius:50%;background:var(--accent)}

/* шторка */
.shade{position:fixed;inset:0;background:rgba(15,18,24,.45);z-index:60;opacity:0;transition:opacity .2s}
.shade.on{opacity:1}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,var(--col));z-index:61;max-height:94vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;transform:translate(-50%,100%);transition:transform .25s ease;padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
.sheet.on{transform:translate(-50%,0)}
.grab{width:40px;height:4px;border-radius:2px;background:#d3d7de;margin:8px auto 2px}
.sh-h{padding:8px 16px 12px;display:flex;gap:12px;align-items:flex-start}
.sh-h .t{flex:1;min-width:0}
.sh-h h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.2px}
.sh-h p{margin:2px 0 0;font-size:14px;color:var(--ink2)}
.sh-h .ph{width:64px;height:64px;border-radius:12px;background:var(--fill) center/contain no-repeat;flex:none}
.sh-b{padding:0 16px}
.stock{font-size:13.5px;color:var(--ink2);margin-top:6px}
.stock b{color:var(--ink);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}.kv span{color:var(--ink2)}.kv b{font-weight:600;text-align:right}
.kv.rd b{color:var(--red)}
.hh{font-size:12.5px;font-weight:600;color:var(--ink2);margin:14px 0 2px}
a.sb{display:flex;align-items:center;justify-content:center;text-decoration:none}

.seller .owner{display:none!important}
.dstop{margin:8px 12px 0;padding:12px 14px;border-radius:14px;background:#c0392b;color:#fff;font-weight:600;font-size:14.5px;line-height:1.35}
.dstop small{display:block;font-weight:400;opacity:.9;font-size:12.5px;margin-top:2px}
.dbar{height:8px;border-radius:4px;background:var(--fill);margin-top:8px;overflow:hidden}.dbar i{display:block;height:100%;background:var(--accent)}.dbar.end i{background:#c0392b}
.pick{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:500}.pick small{display:block;color:var(--ink2);font-weight:400;font-size:12.5px}
.sel{width:100%;height:46px;border-radius:12px;border:0;background:var(--fill);padding:0 12px;font-size:16px;font-weight:600;outline:0;-webkit-appearance:none;appearance:none}
.acc{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.acc .undo{display:block;margin:6px 0 0 auto}.acc>div:last-child{padding-left:14px}
.acc b{font-size:18px}.acc small{display:block;color:var(--ink2);font-weight:400;font-size:12.5px}
.row2{display:grid;grid-template-columns:minmax(0,1.4fr) .7fr .7fr;gap:8px;margin-bottom:8px}
.row2 input{height:44px;border-radius:10px;border:0;background:var(--fill);padding:0 10px;font-size:15px;min-width:0}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.ph .btn{flex:0 0 auto;padding:0 16px;display:inline-flex;align-items:center}.ph span{font-size:13px;color:var(--ink2)}
.dlg{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(15,18,24,.5);padding:20px}
.dlg .box{background:var(--card);border-radius:18px;padding:18px;max-width:340px;width:100%}
.dlg p{margin:0 0 14px;font-weight:500}
.dlg .b2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:48px;border-radius:12px;background:var(--fill);font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px);transform:translate(-50%,160%);opacity:0;visibility:hidden;pointer-events:none;z-index:90;width:min(calc(100% - 24px),520px);background:#15181d;color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;transition:transform .25s,opacity .25s,visibility .25s}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto}
.toast .m{flex:1;min-width:0;font-weight:600;font-size:14px}
.toast .m small{display:block;font-weight:400;opacity:.75;margin-top:1px}
.toast button{color:var(--accent);font-weight:700;height:36px;padding:0 6px}
.toast.err{background:var(--red)}
.toast.err button{color:#fff}

/* ПК: от 1000 px — меню слева, контент на всю ширину, окна справа */
.side{display:none}

/* вид позиций: наименование главное, шипы синие, липучки красные */
:root{--ship:#2457d6;--nav:58px}
.sug button{align-items:center}
.sug button.ship{box-shadow:inset 4px 0 0 var(--ship)}
.sug button.lip{box-shadow:inset 4px 0 0 var(--red)}
.sug b{font-size:15.5px;line-height:1.25;white-space:normal}
.sug span{font-size:12.5px;margin-top:2px}
.sug button>div{padding-left:4px}
.sug .tt{display:inline-block;font-size:10.5px;font-weight:600;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px;color:#fff}
.sug .tt.ship{background:var(--ship)} .sug .tt.lip{background:var(--red)}
.row.ship{box-shadow:inset 4px 0 0 var(--ship)} .row.lip{box-shadow:inset 4px 0 0 var(--red)}
.allbtn{display:block;width:100%;margin:12px 0 6px;padding:12px;border-radius:12px;background:var(--fill);font-weight:600;font-size:14px;color:var(--ink2)}
.moreb{display:block;width:100%;padding:13px;font-weight:600;font-size:14px;color:var(--ink2);background:var(--bg)}
/* полоса дней, как в Kaspi Travel */
.dstrip{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dstrip::-webkit-scrollbar{display:none}
.dstrip button{flex:none;min-width:68px;padding:8px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;line-height:1.2}
.dstrip button small{display:block;font-size:11.5px;color:var(--ink3);text-transform:lowercase}
.dstrip button b{display:block;font-size:15px;font-weight:600}
.dstrip button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dstrip button.on small{color:#c9ced6}
.dstrip button.cal{min-width:48px;display:flex;align-items:center;justify-content:center}
.dstrip input[type=date]{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.op .m .tm{color:var(--ink3)}
/* нижняя панель */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--ink3)}
.tabbar button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--ink);font-weight:600}
.tabbar button.on svg{stroke:var(--accent-d)}
body.seller .tabbar [data-go=abc]{display:none}
.toast{bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px)}
@media (min-width:1000px){.tabbar{display:none}.toast{bottom:20px}}

/* журнал продаж: группы, поиск, комплект */
.hrow{display:flex;align-items:center;justify-content:space-between}
.btn.smb{height:34px;padding:0 12px;border-radius:9px;font-size:13px;color:var(--red)}
.vsw{padding:6px 16px 4px}
.sg{border-bottom:1px solid var(--line);box-shadow:inset 4px 0 0 transparent}
.sg.ship{box-shadow:inset 4px 0 0 var(--ship)} .sg.lip{box-shadow:inset 4px 0 0 var(--red)}
.gh{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 16px 12px 20px}
.gh .l{flex:1;min-width:0}.gh .l b{display:block;font-weight:600;font-size:15px;line-height:1.25}.gh .l span{display:block;font-size:12.5px;color:var(--ink2)}
.gh .r{text-align:right;flex:none}.gh .r b{display:block;font-size:15px}.gh .r span{font-size:12.5px;color:var(--ink2)}.gh em{font-style:normal;color:var(--ink3);width:14px}
.op.sub{padding-left:28px;background:var(--bg);border-bottom:1px solid var(--line)}
.op .cm{font-size:13px;color:var(--ink2);font-style:italic;margin-top:3px}
.op.expo{box-shadow:inset 4px 0 0 var(--red)}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 10px);z-index:50;display:flex;background:var(--ink);color:#fff;border-radius:14px;overflow:hidden}
.cartbar #cartOpen{flex:1;display:flex;justify-content:space-between;padding:14px 16px;text-align:left}
.cartbar .x2{width:48px;font-size:22px;color:#c9ced6}
.cartdlg .box{max-width:420px;max-height:90vh;overflow:auto}
.cli{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.cli .l{flex:1;min-width:0}.cli b{display:block;font-weight:600;font-size:14.5px}.cli small{color:var(--ink2);font-size:12.5px}
.cin{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:13px;color:var(--ink2)}
.cin .inp{height:38px;width:76px;padding:0 8px;font-size:15px}
.cx{width:34px;height:34px;font-size:22px;color:var(--ink3)}
body.hascart .toast{bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 78px)}
.ctot{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink2);margin:0 0 12px}.ctot b{font-size:20px;color:var(--ink)}
@media (min-width:1000px){body.hascart .toast{bottom:84px}.cartbar{left:calc(var(--side) + 24px);right:24px;bottom:20px}}
@media (min-width:1000px){
  :root{--col:1520px;--side:244px;--nav:0px}
  .app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:auto auto auto 1fr;align-items:start}
  .app>:not(.side){grid-column:2}
  .side{display:flex;flex-direction:column;gap:2px;grid-column:1;grid-row:1/span 4;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:20px 12px 24px}
  .sbrand{font-weight:700;font-size:18px;padding:0 12px 14px}
  .sbrand small{display:block;font-weight:400;font-size:12.5px;color:var(--ink3)}
  .sh2{font-size:12.5px;font-weight:600;color:var(--ink3);padding:16px 12px 4px}
  .si{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:40px;padding:0 12px;border-radius:10px;text-align:left;font-weight:500;color:var(--ink2);position:relative}
  .si:hover{background:var(--bg)}
  .si.on{background:var(--fill);color:var(--ink);font-weight:600}
  .si.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent)}
  .si em{font-style:normal;font-size:12.5px;color:var(--ink2);background:var(--fill);border-radius:10px;padding:1px 8px}
  .si.on em{background:var(--card)}
  #btnBack,#btnMenu{display:none}
  .top{padding:16px 24px 8px;border-bottom:1px solid var(--line)}
  .brand{font-size:20px}
  .sec,.row,.op,.lnk,.acc,.inrow,.sum3,.invbar,.dayrow,.grp,.h2{padding-left:24px;padding-right:24px}
  .sec{padding-top:20px;padding-bottom:20px}
  .sbar{padding-left:24px;padding-right:24px}
  .banner{margin:8px 24px}.dstop{margin:8px 24px 0}
  .more{width:calc(100% - 48px);margin:12px 24px}
  .row:hover,.sug button:hover,.cls-b .op:hover{background:var(--bg)}
  main{padding-bottom:40px}
  #tab-sales.on{display:grid;grid-template-columns:minmax(380px,480px) minmax(0,1fr);align-items:start}
  #tab-sales>.sec{grid-column:1;grid-row:1/span 6;position:sticky;top:var(--topH,64px);min-height:calc(100vh - var(--topH,64px));border-right:1px solid var(--line)}
  #tab-sales>:not(.sec){grid-column:2}
  #tab-buy.on{display:grid;grid-template-columns:minmax(380px,540px) minmax(0,1fr)}
  #tab-buy>.sec:nth-child(1),#tab-buy>.sec:nth-child(2){grid-column:1}
  #tab-buy>.sec:nth-child(3){grid-column:2;grid-row:1/span 2;border-top:0;border-left:1px solid var(--line)}
  #moreMain{display:grid;grid-template-columns:1fr 1fr;column-gap:32px;align-content:start}
  #moreMain>.h2,#moreMain>.kpis,#moreMain>.owner{grid-column:1/-1}
  #moreMain>.owner{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
  #moreMain>.owner>.h2{grid-column:1/-1}
  #morePage{max-width:980px}
  #tab-stock{max-width:1120px}
  .sheet{left:auto;right:0;top:0;bottom:0;width:min(520px,100%);max-height:none;border-radius:0;transform:translateX(100%);box-shadow:-10px 0 32px rgba(15,18,24,.18)}
  .sheet.on{transform:none}
  .grab{display:none}
  #menu{display:none!important}
  .toast{left:calc(50% + var(--side)/2)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

        <div class="ttabs" id="ttabs">

          <span class="sp"></span>
          <button class="tg on" id="stockToggle">В наличии</button>

        <div id="fbar"></div>
      </div>
      <div id="list"></div>
    </section>

    <!-- ПРОДАЖИ -->

      <div id="salesBody"></div>
    </section>

    <!-- ПРИХОД -->

      <div class="sec">
        <div class="f">
          <div class="lbl">Позиция</div>
          <div class="seg" id="buyMode"><button data-m="old" class="on">Есть на складе</button><button data-m="new">Новая</button></div>
        </div>
        <div id="buyOld">
          <input class="inp" id="buyQ" type="search" inputmode="search" autocomplete="off" spellcheck="false" placeholder="Размер или название">
          <div class="sug" id="buySug"></div>
          <div class="chosen hidden" id="buyChosen"></div>
        </div>
        <div id="buyNew" class="hidden">
          <div class="f"><input class="inp" id="newSize" autocomplete="off" placeholder="Размер: 2454518 или 245/45/18"></div>

        </div>
      </div>

<script>
(function(){
'use strict';

/* ---------- утилиты ---------- */
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(v){ var n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.')); return isFinite(n)?n:0; }
function fm(n){ n=Math.round(num(n)); return n.toLocaleString('ru-RU').replace(/\u00A0|\u202F/g,' '); }

function isoOf(d){ return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

      .withFailureHandler(function(e){ rej(new Error((e&&e.message)||String(e))); })[fn](arg||{});
  });
}

/* ---------- состояние ---------- */
var TAG_URL='https://script.google.com/macros/s/AKfycbw9-w1jUj7-7UP8e-0qUMDbp4_dj3I39ifiF6mc21e8hBlRDzg712zIlsgWUYaPUD_Y/exec';
var S={
  items:[], meta:{}, tab:'sales', q:'', type:'', hist:false, flt:'', idle:60, cover:45, limit:120,
  minMargin:+(lsGet('shm_minm')||5000), lastQty:+(lsGet('shm_lastqty')||4),
  sales:null, dayC:{}, purchases:[], busy:false, salesDay:todayISO(),

/* ---------- размер, тип, поиск ---------- */
function tcat(t){ t=String(t||'').toUpperCase(); if(t==='ЛИПУЧКА') return 'lip'; if(t==='КАМЕРА') return 'cam'; return 'ship'; }
function tshort(t){ t=String(t||'').toUpperCase(); return t==='ЛИПУЧКА'?'липучка':t==='КАМЕРА'?'камера':t==='ПОДШИП'?'подшип':'шипы'; }
function diam(s){ var p=String(s).split('/'); if(p.length<2) return 0; var d=p.length>=3?p[2]:p[1]; return parseInt(d,10)||0; }
function dkey(s){ return diam(s)||999; }
function normSize(raw){
  var s=String(raw||'').toUpperCase().replace(/С/g,'C').replace(/Р/g,'R').replace(/\s+/g,'');
  if(/^\d{7}$/.test(s)) return s.slice(0,3)+'/'+s.slice(3,5)+'/'+s.slice(5);
  var m=s.match(/^(\d{3})[\/\-X*.](\d{2})[\/\-X*.R]+(\d{2}C?)$/);
  if(m) return m[1]+'/'+m[2]+'/'+m[3];
  return String(raw||'').trim();
}
function parseQ(raw){
  var up=String(raw||'').toUpperCase().replace(/С/g,'C').replace(/Р/g,'R');
  var size='', rest=String(raw||'');
  var compact=up.replace(/\s+/g,'');
  if(/^\d{7}$/.test(compact)){ size=compact.slice(0,3)+'/'+compact.slice(3,5)+'/'+compact.slice(5); rest=''; }
  else{
    var m=up.match(/(\d{3})\s*[\/\-xX*\s]\s*(\d{2})\s*[\/\-xX*\sR]+\s*(\d{2})/);
    if(m){ size=m[1]+'/'+m[2]+'/'+m[3]; rest=rest.slice(0,m.index)+' '+rest.slice(m.index+m[0].length); }
    else{ var m2=up.match(/^\s*(\d{3})\s*[\/\-xX*\s]\s*(\d{2})\s*$/); if(m2){ size=m2[1]+'/'+m2[2]; rest=''; } }
  }
  return {size:size,toks:rest.toLowerCase().split(/\s+/).filter(Boolean)};
}
function matches(it,pq){
  if(pq.size && String(it.s).toUpperCase().replace(/С/g,'C').indexOf(pq.size)===-1) return false;
  if(!pq.toks.length) return true;
  var hay=(it.s+' '+it.n+' '+it.t+' '+(it.br||'')).toLowerCase();
  for(var i=0;i<pq.toks.length;i++){ if(hay.indexOf(pq.toks[i])===-1) return false; }
  return true;
}
function sortItems(a){
  return a.slice().sort(function(x,y){
    var dx=dkey(x.s), dy=dkey(y.s); if(dx!==dy) return dx-dy;
    var c=x.s.localeCompare(y.s,'ru',{numeric:true,sensitivity:'base'}); if(c) return c;
    c=String(x.t).localeCompare(String(y.t),'ru'); if(c) return c;
    return (x.pr||0)-(y.pr||0);
  });
}
function fifoCost(it,q){
  var need=q,total=0,b=it.b||[];
  for(var i=0;i<b.length&&need>0;i++){ var take=Math.min(b[i][2],need); total+=take*b[i][3]; need-=take; }
  if(need>0){ var last=b.length?b[b.length-1][3]:(it.c||0); total+=need*last; }
  return total;
}
function findItem(k){ for(var i=0;i<S.items.length;i++){ if(S.items[i].k===k) return S.items[i]; } return null; }
function idleDays(it){ var l=Math.max(it.ls||0,it.ld||0); return l?Math.floor((Date.now()-l)/864e5):null; }
function runway(it){ return (it.s30>0&&it.o>0)?Math.round(it.o/(it.s30/30)):null; }
function fltPass(it,flt){
  if(flt==='stale'){ if(!(it.o>0)) return false; var d=idleDays(it); return d!==null&&d>=S.idle; }
  if(flt==='low'){ if(!(it.o>0)) return false; var rw=runway(it); return it.o<4||(rw!==null&&rw<14); }
  if(flt==='buy'){ if(!(it.s30>=2)) return false; var rb=it.o>0?runway(it):0; return rb!==null&&rb<S.cover; }
  if(flt==='kasp'){ return it.o>0&&it.km>0&&it.ka>it.km; }
  return true;
}
function buyNeed(it){
  var sp=it.s30/30, need=Math.ceil(sp*S.cover-Math.max(it.o,0));
  return need>0?Math.ceil(need/4)*4:0;
}

/* ---------- загрузка ---------- */
function applyData(r){
  if(r.items){ S.items=r.items; S.meta=r.meta||{}; }
  if(r.sales){
    // продажи, которые ещё пишутся (нет номера строки), не теряем при свежем ответе сервера
    var keep=(S.sales&&S.sales.date===r.sales.date&&S.sales.rows||[]).filter(function(x){ return x.pend&&!x.row; });
    if(keep.length){ r.sales.rows=(r.sales.rows||[]).concat(keep); recalcSales(r.sales); }
    if(r.sales.date) S.dayC[r.sales.date]=r.sales;
    if(!r.sales.date || r.sales.date===S.salesDay) S.sales=r.sales;
  }
  if(r.purchases) S.purchases=r.purchases;
  if(r.dump) S.dump=r.dump;
}
function saveCache(){ lsSet('shm_idx_v2',JSON.stringify({items:S.items,meta:S.meta,sales:S.sales,purchases:S.purchases})); }
var loadTries=0;
// итоги дня по строкам (после правок в телефоне, пока сервер не ответил)
function recalcSales(s){
  var q=0,sum=0,m=0;
  (s.rows||[]).forEach(function(r){
    if(r.ret){ q-=r.q; sum-=r.pr*r.q; m+=(r.m||0); return; }
    if(r.y==='СПИСАНИЕ'||r.y==='НЕДОСТАЧА'){ m+=(r.m||0); return; }
    q+=r.q; sum+=r.q*r.pr; m+=(r.m||0);
  });
  s.qty=q; s.sum=sum; s.margin=m;
  s.expSum=(s.exp||[]).reduce(function(t,x){ return t+x.sum; },0);
}
function itemOf(sz,nm){
  sz=String(sz).toUpperCase(); nm=String(nm).toUpperCase();
  for(var i=0;i<S.items.length;i++){ var it=S.items[i]; if(String(it.s).toUpperCase()===sz&&String(it.n).toUpperCase()===nm) return it; }
  return null;
}
// отмена продаж: сразу убираем у себя и возвращаем остаток, сервер — в фоне; ошибка — всё назад
function undoSaleRows(rowNums,date,stock,okMsg){
  var s=S.dayC[date]||(S.sales&&S.sales.date===date?S.sales:null), removed=[];
  if(s){ s.rows=(s.rows||[]).filter(function(r){ if(!r.ret&&rowNums.indexOf(r.row)>=0){ removed.push(r); return false; } return true; }); recalcSales(s); }
  var back=stock||removed.map(function(r){ return {s:r.s,n:r.n,q:r.q}; });
  back.forEach(function(b){ var it=itemOf(b.s,b.n); if(it) it.o=(it.o||0)+b.q; });
  saveCache(); renderAll(); toast('Отменяю…','',{ms:60000});
  var chain=Promise.resolve(), last=null;
  rowNums.slice().sort(function(a,b){ return b-a; }).forEach(function(rw){
    chain=chain.then(function(){ return run('appUndoSale',{reqId:rid(),row:rw,date:date}).then(function(x){ last=x; }); });
  });
  return chain.then(function(){ if(last) applyData(last); saveCache(); renderAll(); toast(okMsg||'Продажа отменена'); })
    .catch(function(e){
      back.forEach(function(b){ var it=itemOf(b.s,b.n); if(it) it.o=Math.max(0,(it.o||0)-b.q); });
      if(s){ s.rows=s.rows.concat(removed); recalcSales(s); }
      saveCache(); renderAll(); toast('Не отменилось',e.message,{err:true});
      refreshDay(date);
    });
}
function refreshDay(date){ run('appGetSales',{date:date}).then(function(r){ applyData(r); renderSales(); }).catch(function(){}); }
function loadOps(){
  run('appOpsInit',{}).then(function(o){
    S.ops=o; document.body.classList.toggle('seller',o.role==='seller');
    if(o.role==='seller') document.body.classList.add('hide');
  }).catch(function(){});
}
function load(force){
  $('stamp').textContent='обновляю…';
  return run(force?'appRefresh':'appInit',{date:S.salesDay}).then(function(r){
    loadTries=0; applyData(r); $('banner').innerHTML=''; renderAll(); saveCache(); loadOps();
  }).catch(function(e){
    var net=/HTTP 0|NetworkError|Ошибка подключения|Нет связи/i.test(e.message);
    if(net && loadTries<2){ loadTries++; $('banner').innerHTML='<div class="banner">Связь с таблицей не установилась, пробую ещё раз…</div>'; setTimeout(function(){ load(true); },1800); return; }
    var hint=net?' Обычно это из-за нескольких аккаунтов Google в браузере: откройте ссылку в приватном окне и войдите только в один аккаунт.':'';
    $('banner').innerHTML='<div class="banner">Не удалось загрузить данные: '+esc(e.message)+'.'+hint+' <a href="#" id="retry">Повторить</a></div>';
    var rt=$('retry'); if(rt) rt.onclick=function(ev){ ev.preventDefault(); loadTries=0; load(true); };
  }).then(function(){ renderStamp(); });
}

function renderList(){
  var pq=parseQ(S.q), flt=S.flt;
  var arr=S.items.filter(function(it){
    if(flt){ if(!fltPass(it,flt)) return false; }
    else if(!S.hist && !(it.o>0)) return false;
    if(S.type && tcat(it.t)!==S.type) return false;
    return matches(it,pq);
  });
  if(flt==='stale') arr.sort(function(x,y){ return (y.o*(y.c||0))-(x.o*(x.c||0)); });
  else if(flt==='kasp') arr.sort(function(x,y){ return ((y.ka-y.km)*y.o)-((x.ka-x.km)*x.o); });
  else if(flt==='buy') arr.sort(function(x,y){ var a=x.o>0?runway(x):0, b=y.o>0?runway(y):0; return a-b; });
  else if(flt==='low') arr.sort(function(x,y){ var a=runway(x),b=runway(y); a=a===null?999:a; b=b===null?999:b; return a-b||x.o-y.o; });
  else arr=sortItems(arr);
  var total=arr.length, shown=arr.slice(0,S.limit), el=$('list');
  if(!S.items.length){ el.innerHTML='<div class="empty">Загружаю склад…</div>'; return; }
  if(!total){ el.innerHTML='<div class="empty">'+(flt?'В этом списке пусто.':'Ничего не найдено.<br>Попробуйте другой размер или нажмите «В наличии», чтобы увидеть всю историю.')+'</div>'; return; }
  var html='', lastD=null, lastS=null, cnt={};
  if(!flt) arr.forEach(function(it){ var d=diam(it.s); cnt[d]=(cnt[d]||0)+(it.o>0?it.o:0); });
  shown.forEach(function(it){
    var d=diam(it.s), newGrp=false;
    if(!flt && d!==lastD){ newGrp=true; html+='<div class="grp"><span>'+(d?'R'+d:'Камеры и прочее')+'</span><span>'+fm(cnt[d])+' шт</span></div>'; lastD=d; }
    if(!flt && lastS!==null && it.s!==lastS && !newGrp) html+='<div class="gap"></div>';
    lastS=it.s;
    var st=it.o<=0?'zero':it.o<4?'low':'';
    var notes='';
    var idl=idleDays(it), rw=runway(it);
    if(flt==='stale'&&idl!==null) notes+='<span class="w">не продаётся '+idl+' дн.</span>';
    if(flt==='buy'){ var nd=buyNeed(it); if(nd) notes+='<span class="w">купить ~'+nd+' шт</span>'; if(it.s30) notes+='<span>'+(Math.round(it.s30/30*7*10)/10)+' шт/нед</span>'; }
    if(flt==='kasp') notes+='<span class="r">Kaspi выше рынка на '+fm(it.ka-it.km)+' ₸</span>';
    if(flt==='low'&&rw!==null) notes+='<span class="w">хватит ~'+rw+' дн.</span>';
    html+='<div class="row '+(tcat(it.t)==='lip'?'lip':tcat(it.t)==='ship'?'ship':'')+'" data-k="'+esc(it.k)+'"><div class="l"><div class="sz">'+esc(it.s)+'<i>'+tshort(it.t)+'</i></div><div class="nm">'+esc(it.n)+'</div>'+(notes?'<div class="nt">'+notes+'</div>':'')+'</div>'+
      '<div class="r"><div class="pr">'+(it.pr?fm(it.pr)+' ₸':'нет цены')+'</div><div class="st '+st+'">'+fm(it.o)+' шт</div></div></div>';
  });
  if(total>shown.length) html+='<button class="more" id="more">Показать ещё ('+(total-shown.length)+')</button>';
  el.innerHTML=html;
  var m=$('more'); if(m) m.onclick=function(){ S.limit+=150; renderList(); };
}

function doSale(){
  var s=S.sale, it=s.it; if(!it||S.busy) return;
  var qty=Math.round(num($('sQty').value)), price=num($('sPrice').value);
  if(!(qty>0&&price>0)) return;
  var risk=saleRisk();
  if(risk&&!s.confirm){ s.confirm=true; renderSaleSheet(); return; }
  var date=($('sDate')&&$('sDate').value)||todayISO(), pay=s.pay, rid0=s.rid;
  var com=($('sCom')&&$('sCom').value||'').trim();
  if(cart.length){ cart.push({it:it,qty:qty,price:price}); S.lastQty=qty; closeSheet(); $('sq').value=''; saleSug(); renderHot(); renderCartBar(); openCart(); return; }
  if(com){ S.lastQty=qty; lsSet('shm_lastqty',String(qty)); sellLines([{it:it,qty:qty,price:price}],0,com,pay,date); return; }
  // сразу показываем продажу у себя и закрываем окно: сервер дописывает таблицу в фоне
  S.lastQty=qty; lsSet('shm_lastqty',String(qty));
  S.salesDay=date; $('salesDate').value=date;
  if(!S.sales||S.sales.date!==date) S.sales=S.dayC[date]||null;
  it.o=Math.max(0,(it.o||0)-qty);
  var pend={row:0,s:it.s,n:it.n,q:qty,pr:price,c:0,m:0,u:false,w:'',y:pay,pend:1,t:nowHM()};
  var inDay=!!(S.sales&&S.sales.date===date);

  else refreshDay(date);

  toast('Записываю '+qty+' × '+it.s, money(price*qty),{ms:60000});
  run('appAddSale',{reqId:rid0,size:it.s,name:it.n,qty:qty,price:price,pay:pay,date:date,fast:1}).then(function(r){
    pend.row=r.row; pend.u=true; pend.pend=0; if(inDay) recalcSales(S.sales); saveCache(); renderSales();
    if(!inDay) refreshDay(date);

      undoSaleRows([row],date,inDay?null:[{s:it.s,n:it.n,q:qty}]);
    }});
    queueFinish(it,row,date);
  }).catch(function(e){
    it.o+=qty;
    if(inDay){ S.sales.rows=S.sales.rows.filter(function(x){ return x!==pend; }); recalcSales(S.sales); }
    saveCache(); renderAll();

  });
}

// записать одну или несколько позиций одной продажей (комплект, комментарий)
function sellLines(lines,total,com,pay,date){
  lines.forEach(function(l){ l.it.o=Math.max(0,(l.it.o||0)-l.qty); });
  S.salesDay=date; $('salesDate').value=date;
  if(!S.sales||S.sales.date!==date) S.sales=S.dayC[date]||null;
  var inDay=!!(S.sales&&S.sales.date===date);
  var tot0=lines.reduce(function(t,l){ return t+l.qty*l.price; },0);
  var pends=lines.map(function(l,i){ return {row:0,s:l.it.s,n:l.it.n,q:l.qty,pr:(total>0&&tot0>0)?Math.round(l.price*total/tot0):l.price,c:0,m:0,u:false,w:'',y:pay,pend:1,t:nowHM(),cm:(i===lines.length-1?com:'')}; });
  if(inDay){ S.sales.rows=(S.sales.rows||[]).concat(pends); recalcSales(S.sales); }
  closeSheet(); $('sq').value=''; saleSug(); renderAll();
  var sumTxt=money(total>0?total:lines.reduce(function(t,l){ return t+l.qty*l.price; },0));
  toast('Записываю '+(lines.length>1?lines.length+' поз.':lines[0].qty+' × '+lines[0].it.s),sumTxt,{ms:60000});
  run('appAddSaleBatch',{reqId:rid(),items:lines.map(function(l){ return {size:l.it.s,name:l.it.n,qty:l.qty,price:l.price}; }),total:total,comment:com,pay:pay,date:date}).then(function(r){
    var rows=r.rows||[];
    pends.forEach(function(x,i){ x.row=rows[i]; x.pr=(r.prices&&r.prices[i])||x.pr; x.u=true; x.pend=0; });
    if(inDay) recalcSales(S.sales);
    saveCache(); renderSales();
    toast('Продано: '+(lines.length>1?lines.length+' поз.':lines[0].qty+' × '+lines[0].it.s),sumTxt,{label:'Отменить',ms:9000,fn:function(){
      undoSaleRows(rows,date,inDay?null:lines.map(function(l){ return {s:l.it.s,n:l.it.n,q:l.qty}; }));
    }});
    lines.forEach(function(l,i){ queueFinish(l.it,rows[i],date); });
  }).catch(function(e){
    lines.forEach(function(l){ l.it.o+=l.qty; });
    if(inDay){ S.sales.rows=S.sales.rows.filter(function(x){ return pends.indexOf(x)<0; }); recalcSales(S.sales); }
    saveCache(); renderAll();
    toast('Не записано',e.message,{err:true});
  });
}

  var exps=(s.exp||[]).filter(function(x){ return !q||(x.text+' '+x.sum).toLowerCase().indexOf(q)>=0; });

  h+='<div class="vsw"><div class="mini" id="viewSw"><button data-v="grp" class="'+(S.salesView!=='time'?'on':'')+'">По позициям</button><button data-v="time" class="'+(S.salesView==='time'?'on':'')+'">По времени</button></div></div>';
  if(!hasAny) h+='<div class="empty">В этот день продаж нет.</div>';
  else if(q&&!rows.length&&!exps.length) h+='<div class="empty">По запросу ничего не найдено.</div>';
  var sales=rows.filter(function(r){ return !r.ret&&r.y!=='СПИСАНИЕ'&&r.y!=='НЕДОСТАЧА'; });
  var other=rows.filter(function(r){ return r.ret||r.y==='СПИСАНИЕ'||r.y==='НЕДОСТАЧА'; });
  if(S.salesView==='time'){

  }else{
    var g={}, order=[];
    sales.forEach(function(r){ var k=r.s+'|'+r.n; if(!g[k]){ g[k]={s:r.s,n:r.n,q:0,sum:0,m:0,rows:[],k:k}; order.push(k); } var x=g[k]; x.q+=r.q; x.sum+=r.pr*r.q; x.m+=r.m; x.rows.push(r); });
    order.sort(function(a,b){ return g[b].q-g[a].q; });
    order.forEach(function(k){
      var x=g[k], open=!!(S.openG&&S.openG[k])||!!q;
      var it=null; (S.items||[]).forEach(function(i){ if(!it&&i.s===x.s&&i.n===x.n) it=i; });
      var cls=it?(tcat(it.t)==='lip'?' lip':tcat(it.t)==='ship'?' ship':''):'';
      h+='<div class="sg'+cls+'"><button class="gh" data-g="'+esc(k)+'"><div class="l"><b>'+esc(x.n)+'</b><span>'+esc(x.s)+'</span></div><div class="r"><b>'+fm(x.q)+' шт</b><span>'+money(x.sum)+'<i class="secret"> · '+money(x.m)+'</i></span></div><em>'+(open?'▴':'▾')+'</em></button>';
      if(open){ x.rows.slice().sort(function(a,b){ return (b.t||'').localeCompare(a.t||'')||b.row-a.row; }).forEach(function(r){ h+=opHtml(r,false); }); }
      h+='</div>';
    });
    other.forEach(function(r){ h+=opHtml(r,true); });
  }
  if(exps.length){
    h+='<div class="h2 owner">Расходы · '+money(exps.reduce(function(t,x){ return t+x.sum; },0))+'</div>';
    exps.forEach(function(x){
      h+='<div class="op expo owner"><div class="l"><b>'+esc(x.text)+'</b>'+(x.t?'<div class="m"><span class="tm">'+esc(x.t)+'</span></div>':'')+(x.pend?'<div class="m">записываю…</div>':'<div class="btns"><button class="undo" data-act="uexp" data-row="'+x.row+'">Отменить</button></div>')+'</div><div class="r">−'+money(x.sum)+'</div></div>';
    });
  }
  el.innerHTML=h;
}

function sugHtml(arr){
  return arr.map(function(it){ return '<button data-k="'+esc(it.k)+'"><div><b>'+esc(it.s)+'</b><span>'+esc(it.n)+'</span></div><em>'+fm(it.o)+' шт</em></button>'; }).join('');
}
function searchPool(q){
  var pq=parseQ(q); if(!q.trim()) return [];
  var a=S.items.filter(function(it){ return matches(it,pq); });
  a.sort(function(x,y){ return (y.o>0)-(x.o>0) || x.s.localeCompare(y.s,'ru',{numeric:true}); });
  return a.slice(0,8);
}
function pickBuy(it){
  S.buy.it=it; S.buy.mode='old'; $('buyQ').value=''; $('buySug').innerHTML='';
  if(it.sup && it.sup!=='ОСТАТКИ'){ S.buy.sup=it.sup; S.buy.supOther=false; }

function buyCalc(){
  var cost=S.buy.cur==='USD'?num($('buyCost').value)*num($('buyRate').value):num($('buyCost').value);
  var exp=num($('buyExp').value), mk=($('buyMk').value===''?33.5:num($('buyMk').value))/100;
  var key=cost+exp, manual=num($('buyManual').value);
  var cash=manual>0?manual:(cost>0?Math.ceil((cost+cost*mk)/1000)*1000+900:0);
  return {cost:cost,key:key,cash:cash,margin:cash?Math.floor(((cash-900)-key)/10)*10:0};
}

// фото чека: уменьшаем до 1280 px, чтобы грузилось быстро
function shrinkPhoto(file){
  return new Promise(function(res,rej){
    if(file.type==='application/pdf'){ var fr=new FileReader(); fr.onload=function(){ res({mime:file.type,b64:String(fr.result).split(',')[1]}); }; fr.onerror=function(){ rej(new Error('Не прочитался файл')); }; fr.readAsDataURL(file); return; }
    var img=new Image(), u=URL.createObjectURL(file);
    img.onload=function(){
      var k=Math.min(1,1280/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u);
      res({mime:'image/jpeg',b64:c.toDataURL('image/jpeg',0.72).split(',')[1]});
    };
    img.onerror=function(){ rej(new Error('Не открылось фото')); }; img.src=u;
  });
}
